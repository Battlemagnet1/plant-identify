name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      release_type:
        description: 发行类型
        required: true
        default: 预览发行版
        type: choice
        options:
          - 预览发行版
          - 正式发行版

permissions:
  actions: read
  contents: read

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Calculate build version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          local_date=$(TZ=Asia/Taipei date +%F)
          version_date=$(TZ=Asia/Taipei date +%-Y.%-m.%-d)
          start_epoch=$(date -u -d "$local_date 00:00:00 +0800" +%s)
          end_epoch=$((start_epoch + 86400 - 1))
          day_start=$(date -u -d "@$start_epoch" +%Y-%m-%dT%H:%M:%SZ)
          day_end=$(date -u -d "@$end_epoch" +%Y-%m-%dT%H:%M:%SZ)

          runs=$(gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/android-ci.yml/runs" \
            -f per_page=100 \
            -f created="$day_start..$day_end")
          sequence=$(jq --argjson current "$GITHUB_RUN_NUMBER" \
            '[.[].workflow_runs[].run_number | select(. < $current)] | unique | length + 1' \
            <<<"$runs")

          if (( sequence > 999 )); then
            echo "Daily build limit of 999 has been reached" >&2
            exit 1
          fi

          day_number=$(( $(date -u -d "$local_date" +%s) / 86400 ))
          version_name="$version_date-$sequence"
          version_code=$((day_number * 1000 + sequence))

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Build version: $version_name ($version_code)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run unit tests and build debug APKs
        run: >-
          bash ./gradlew test assembleDebug
          -PciVersionName=${{ steps.version.outputs.version_name }}
          -PciVersionCode=${{ steps.version.outputs.version_code }}
          --stacktrace

      - name: Verify and prepare APKs
        env:
          BUILD_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          BUILD_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p dist

          for edition in base full; do
            source="app/build/outputs/apk/$edition/debug/app-$edition-debug.apk"
            actual_name=$(apkanalyzer manifest version-name "$source")
            actual_code=$(apkanalyzer manifest version-code "$source")

            test "$actual_name" = "$BUILD_VERSION_NAME"
            test "$actual_code" = "$BUILD_VERSION_CODE"

            cp "$source" "dist/plant-identify-$edition-$BUILD_VERSION_NAME.apk"
          done

      - name: Upload base APK
        uses: actions/upload-artifact@v7
        with:
          name: plant-identify-base-${{ steps.version.outputs.version_name }}
          path: dist/plant-identify-base-${{ steps.version.outputs.version_name }}.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload full APK
        uses: actions/upload-artifact@v7
        with:
          name: plant-identify-full-${{ steps.version.outputs.version_name }}
          path: dist/plant-identify-full-${{ steps.version.outputs.version_name }}.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-release:
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download base APK
        uses: actions/download-artifact@v8
        with:
          name: plant-identify-base-${{ needs.build-and-test.outputs.version_name }}
          path: dist

      - name: Download full APK
        uses: actions/download-artifact@v8
        with:
          name: plant-identify-full-${{ needs.build-and-test.outputs.version_name }}
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION_NAME: ${{ needs.build-and-test.outputs.version_name }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail

          tag="v$BUILD_VERSION_NAME"
          release_args=(
            "$tag"
            "dist/plant-identify-base-$BUILD_VERSION_NAME.apk"
            "dist/plant-identify-full-$BUILD_VERSION_NAME.apk"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "Plant Identify $BUILD_VERSION_NAME"
            --generate-notes
          )

          case "$RELEASE_TYPE" in
            预览发行版)
              release_args+=(--prerelease --latest=false)
              ;;
            正式发行版)
              release_args+=(--latest)
              ;;
            *)
              echo "Unknown release type: $RELEASE_TYPE" >&2
              exit 1
              ;;
          esac

          gh release create "${release_args[@]}"
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
