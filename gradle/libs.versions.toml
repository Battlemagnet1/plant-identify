# Plant Identify Library —— 依赖版本目录
#
# 【版本策略：为什么不写 Kotlin 2.4.20】
# AGP 9.0 起内置 Kotlin 支持，且不再允许手动应用 org.jetbrains.kotlin.android。
# AGP 9.1.1 的 POM 中锁定 kotlin-gradle-plugin 2.2.10，即项目实际使用的 Kotlin
# 编译器版本是 2.2.10。因此：
#   - Compose 编译器插件版本必须 = Kotlin 版本 = 2.2.10（版本不一致会直接报错）
#   - KSP 必须使用「新版独立版本号」2.3.12。注意：与 Kotlin 版本号对齐的旧式
#     2.2.10-2.0.2 反而不能用 —— 它用 kotlin.sourceSets 注册生成目录，
#     在 AGP 9 内置 Kotlin 下会直接报错
#   - 升到 Kotlin 2.4.x 需要绕开内置 Kotlin（显式声明 buildscript classpath），
#     属于不必要的风险，不采用
#
# 【compileSdk 为什么是 37】
# navigation-compose 2.10.1 与 lifecycle 2.11.0 的 AAR 元数据强制要求
# 调用方 compileSdk ≥ 37。targetSdk 仍保持 36（两者相互独立）。
#
# 所有版本均已通过 Maven 仓库元数据核实存在（2026-09-18）。

[versions]
agp = "9.1.1"
# 注意：此处的 kotlin 仅用于 Compose 编译器插件，必须与 AGP 内置的 KGP 版本一致
kotlin = "2.2.10"
ksp = "2.3.12"
composeBom = "2026.06.00"
coreKtx = "1.17.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
navigation = "2.10.1"
room = "2.8.5"
camerax = "1.6.2"
exifinterface = "1.4.2"
datastore = "1.2.1"
# OkHttp 5.5.0 的 kotlin-stdlib 依赖为 2.1.21（Android 变体 2.2.21），
# 与本项目 AGP 内置的 Kotlin 2.2.10 同属 2.2 元数据版本，可直接使用。
okhttp = "5.5.0"
coroutines = "1.10.2"
# WorkManager：方案 §5.1 指定的后台任务调度。已核实 Google Maven 元数据
# （dl.google.com/android/maven2）上 2.11.2 是最新稳定版，2.12.0 尚在 rc。
# 注意别用 Maven Central 查 androidx —— 它上面没有（返回 404）。
work = "2.11.2"
junit = "4.13.2"
# org.json 官方实现（Maven Central）。JVM 单测必需 —— 见下方 libraries 里的说明
orgJson = "20240303"

[libraries]
# --- AndroidX 基础 ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# --- Lifecycle / ViewModel ---
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# --- Compose（版本由 BOM 统一管理，以下不写 version）---
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# --- 导航 ---
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# --- Room ---
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# --- CameraX（Phase 2）---
# 勿用 1.6.0：该版本存在 ListenableFuture 编译错误
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# --- 图片处理（Phase 2）---
# ExifInterface 用于读取拍摄方向：手机照片常靠 EXIF 标记方向，
# 不处理会导致上传给 AI 的图上下颠倒，进而严重影响识别准确率
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# --- 本地配置存储（Phase 2 用于拍摄草稿，Phase 3 用于 AI 服务配置）---
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# --- 网络（Phase 3）---
# 只引入 OkHttp，不引入 Retrofit：
#   1. 本应用只需打两个端点（/chat/completions 与 /models）
#   2. 容错解析链路需要「读原始字符串再逐级降级」，序列化框架的严格解析
#      反而与这个设计目标冲突，直接用 org.json 更贴合
#   3. 少一个编译期代码生成插件，就少一处与 AGP 9 内置 Kotlin 冲突的可能
okhttp-bom = { group = "com.squareup.okhttp3", name = "okhttp-bom", version.ref = "okhttp" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp" }

# --- 后台任务调度（Phase 2：识别任务队列）---
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# --- 测试 ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# JVM 单测里的 org.json。
# Android 运行时自带 org.json，但单元测试跑在桌面 JVM 上：android.jar 里那些类
# 只有方法签名、没有实现，一调用就抛 "not mocked"。容错 JSON 解析是本项目
# 最值得单测的逻辑，直接补一份官方实现，测试才能真跑起来。
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# 不再声明 org.jetbrains.kotlin.android：AGP 9 已内置 Kotlin
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
